services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaki_local}
      POSTGRES_DB: zaki_workspace
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaki -d zaki_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:3000}
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads

  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      LOG_LEVEL: info

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace

volumes:
  db_data:
  redis_data:
  uploads:
