services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zaki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zaki_local}
      POSTGRES_DB: zaki_workspace
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zaki -d zaki_workspace"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not used by the application yet: nothing in the code connects to Redis (the planned
  # realtime layer uses Postgres LISTEN/NOTIFY instead). Kept so the service name and
  # port stay reserved; it can be removed from `app.depends_on` and from this file
  # without touching any code.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Optional. Empty = the key for secrets at rest is derived from AUTH_SECRET (the old
      # behaviour). Set it to a separate random value (openssl rand -hex 32) so rotating
      # AUTH_SECRET no longer breaks the stored Telegram / n8n / Google secrets, then run
      # scripts/reencrypt-secrets.ts once.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Uploaded files. Must be the same path as the volume mounted below (the Dockerfile
      # creates it and gives it to the runtime user), so it is fixed here on purpose.
      UPLOAD_DIR: /app/storage/uploads
      NODE_ENV: production
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/storage/uploads

  # Heartbeat placeholder: worker/index.ts only proves the database connection and logs a
  # tick every 60 seconds - there are no background jobs yet (they will run inside the app
  # process, see docs/PHASE0-AUDIT.md). The image copies worker/ and keeps tsx, so this
  # starts. It mounts the same uploads volume so that a future job sees the same files.
  worker:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "worker"]
    # The image's HEALTHCHECK probes the web server on port 3000. The worker serves nothing,
    # so the inherited check would report it unhealthy for ever.
    healthcheck:
      disable: true
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace
      UPLOAD_DIR: /app/storage/uploads
      LOG_LEVEL: info
    volumes:
      - uploads:/app/storage/uploads

  migrate:
    build: .
    depends_on:
      db:
        condition: service_healthy
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgresql://zaki:${POSTGRES_PASSWORD:-zaki_local}@db:5432/zaki_workspace

volumes:
  db_data:
  redis_data:
  uploads:
